<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Events Manager</title>
    <link rel="stylesheet" href="main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet" />
  </head>
  <body>
    <header>
      <h1>Events Manager</h1>
      <p class="status" role="status" aria-live="polite">Add an event to begin.</p>
    </header>
    <main class="container">
      <form id="event-form" class="add-box">
        <h2>Add Event</h2>
        <label for="event-name">Event name</label>
        <input id="event-name" type="text" class="event-name" placeholder="Team meeting" maxlength="100" required />
        <label for="organizer">Organizer</label>
        <input id="organizer" type="text" class="organizer" placeholder="Your name" maxlength="80" required />
        <label for="event-date">Date</label>
        <input id="event-date" type="date" class="event-date" required />
        <button class="add" type="submit">Add Event</button>
      </form>
      <section aria-labelledby="upcoming-events-title">
        <h2 id="upcoming-events-title">Your events</h2>
        <div class="events" aria-live="polite" aria-busy="true"></div>
      </section>
    </main>
    <script src="main.js"></script>
  </body>
</html>
